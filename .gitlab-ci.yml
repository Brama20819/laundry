image: node:20

stages:
  - deploy

pages:
  stage: deploy
  cache:
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build:prod
    - mkdir public

    - cp -r dist/dutch-girl-laundry/browser/* public/

    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "working"
